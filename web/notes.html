<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes – Ayman El-Toufaili</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="style.css">
<style>
.notes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
  margin-top: 8px;
}

.note-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  box-shadow: var(--shadow);
  transition: border-color 0.2s, transform 0.2s;
}

.note-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
}

.note-date {
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--text2);
  margin-bottom: 10px;
}

.note-content {
  font-size: 0.88rem;
  color: var(--text);
  line-height: 1.75;
  margin-bottom: 12px;
}

.note-image {
  width: 100%;
  border-radius: 8px;
  margin-top: 12px;
  border: 1px solid var(--border);
}

.note-id {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--accent);
  margin-bottom: 8px;
}

.empty-state {
  text-align: center;
  color: var(--text2);
  font-size: 0.88rem;
  padding: 60px 20px;
  font-family: var(--mono);
}
</style>
</head>

<main class="main">
  <header class="page-header">
    <div>
      <h1 class="page-title">Lerntagebuch</h1>
      <p class="page-sub">IT-Notizen aus Unterricht und Praxis · via Telegram Bot</p>
    </div>
  </header>

  <div id="notes-container">
    <div class="empty-state">Notizen werden geladen...</div>
  </div>
</main>

<script>
const savedTheme = localStorage.getItem("theme");
if (savedTheme === "light") {
  document.body.classList.remove("dark");
}

async function loadNotes() {
  try {
    const res = await fetch("/notes-data/notes.json");
    const data = await res.json();
    const container = document.getElementById("notes-container");

    if (!data.entries || data.entries.length === 0) {
      container.innerHTML = '<div class="empty-state">Noch keine Notizen vorhanden.<br>Schick eine Nachricht an den Telegram Bot!</div>';
      return;
    }

    const entries = [...data.entries].reverse();

    container.innerHTML = '<div class="notes-grid">' +
      entries.map(e => `
        <div class="note-card">
          <div class="note-id">#${e.id}</div>
          <div class="note-date">${e.date} · ${e.time}</div>
          <div class="note-content">${e.content}</div>
          ${e.image ? `<img src="/notes-data/images/${e.image}" class="note-image" alt="Notiz Bild">` : ""}
        </div>
      `).join("") +
    "</div>";
  } catch {
    document.getElementById("notes-container").innerHTML =
      '<div class="empty-state">Fehler beim Laden der Notizen.</div>';
  }
}

loadNotes();
</script>
